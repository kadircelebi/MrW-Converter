name: release

# Runs when a vX.Y.Z tag is pushed: runs the tests, then creates (or updates) the GitHub release with the
# text from the "# GitHub release" section of docs/releases/X.Y.Z.md. No files are attached: the app is
# distributed through the Microsoft Store. Tests needing FFmpeg or the model show as skipped here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Version from the tag
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Tag must look like v1.2.3: $TAG" >&2; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The tag must match what is submitted to the Store.
      - name: Check the version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $expected = "${{ steps.ver.outputs.version }}"
          if ($props.Project.PropertyGroup.Version -ne $expected) {
            throw "Directory.Build.props has $($props.Project.PropertyGroup.Version), the tag needs $expected"
          }

      - name: Release notes
        run: |
          NOTES="docs/releases/${{ steps.ver.outputs.version }}.md"
          test -f "$NOTES" || { echo "$NOTES is missing" >&2; exit 1; }
          # The first ```markdown block under the "# GitHub release" heading.
          awk '/^# GitHub release/ { s = 1; next }
               s && /^# / { exit }
               s && !b && /^```markdown/ { b = 1; next }
               b && /^```[[:space:]]*$/ { exit }
               b { print }' "$NOTES" | tr -d '\r' > release-notes.md
          test -s release-notes.md || { echo "No markdown block under '# GitHub release' in $NOTES" >&2; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test tests/MrWConverter.Core.Tests -c Release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "MrW Converter ${{ steps.ver.outputs.version }}" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "MrW Converter ${{ steps.ver.outputs.version }}" --notes-file release-notes.md
          fi
